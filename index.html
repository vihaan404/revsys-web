<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RevSys - Spaced Repetition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>RevSys</h1>
            <div class="sync-controls">
                <span id="syncStatus">No File Connected</span>
                <button id="btnConnect">Connect Sync File</button>
            </div>
        </div>
    </header>

    <main>
        <section class="add-section">
            <h2>Add New Topic</h2>
            <form id="addForm">
                <input type="text" id="topicInput" placeholder="Topic Name (e.g., boolean algebra)" required>
                <input type="text" id="tagInput" placeholder="Subject Tag (e.g., digital logic)" required>
                <button type="submit" id="btnAdd" disabled>Add</button>
            </form>
            <small id="connectionWarning">Please connect a .json file first.</small>
        </section>

        <section class="dashboard-section">
            <h2>Revision Queue</h2>
            <div id="dashboardQueue" class="queue-grid">
                </div>
            
            <div id="paginationControls" class="pagination">
                <button id="btnPrev" disabled>&lt; Prev</button>
                <span id="pageIndicator">Page 1 / 1</span>
                <button id="btnNext" disabled>Next &gt;</button>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
    <script src="secret.js"></script> </body>
</html>
</body>
</html>
